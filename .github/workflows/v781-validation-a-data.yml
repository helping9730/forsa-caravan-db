name: V781 Validation A Raw M1 Acquisition

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  acquire:
    name: ${{ matrix.market }}-${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { market: US500, symbol: USA500IDXUSD, year: 2019 }
          - { market: US500, symbol: USA500IDXUSD, year: 2020 }
          - { market: US500, symbol: USA500IDXUSD, year: 2021 }
          - { market: USTECH100, symbol: USATECHIDXUSD, year: 2019 }
          - { market: USTECH100, symbol: USATECHIDXUSD, year: 2020 }
          - { market: USTECH100, symbol: USATECHIDXUSD, year: 2021 }
          - { market: GERMANY40, symbol: DEUIDXEUR, year: 2019 }
          - { market: GERMANY40, symbol: DEUIDXEUR, year: 2020 }
          - { market: GERMANY40, symbol: DEUIDXEUR, year: 2021 }
          - { market: UK100, symbol: GBRIDXGBP, year: 2019 }
          - { market: UK100, symbol: GBRIDXGBP, year: 2020 }
          - { market: UK100, symbol: GBRIDXGBP, year: 2021 }
          - { market: WTI, symbol: LIGHTCMDUSD, year: 2019 }
          - { market: WTI, symbol: LIGHTCMDUSD, year: 2020 }
          - { market: WTI, symbol: LIGHTCMDUSD, year: 2021 }
          - { market: EURUSD, symbol: EURUSD, year: 2019 }
          - { market: EURUSD, symbol: EURUSD, year: 2020 }
          - { market: EURUSD, symbol: EURUSD, year: 2021 }
          - { market: BTCUSD, symbol: BTCUSD, year: 2019 }
          - { market: BTCUSD, symbol: BTCUSD, year: 2020 }
          - { market: BTCUSD, symbol: BTCUSD, year: 2021 }

    steps:
      - uses: actions/checkout@v4

      - name: Acquire + normalize native Dukascopy BI5 M1 BID
        shell: bash
        run: |
          set -euo pipefail
          python v781_direct_bi5.py             --market "${{ matrix.market }}"             --symbol "${{ matrix.symbol }}"             --year "${{ matrix.year }}"             --workers 2             --out "out/${{ matrix.market }}/${{ matrix.year }}"

      - name: Independent artifact hash verification
        shell: bash
        run: |
          set -euo pipefail
          cd "out/${{ matrix.market }}/${{ matrix.year }}"
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: V781A-${{ matrix.market }}-${{ matrix.year }}
          path: out/${{ matrix.market }}/${{ matrix.year }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
