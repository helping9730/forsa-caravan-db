name: V784 2025 Lockbox Raw M1 Acquisition

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  acquire:
    name: ${{ matrix.market }}-2025
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { market: US500, symbol: USA500IDXUSD }
          - { market: USTECH100, symbol: USATECHIDXUSD }
          - { market: GERMANY40, symbol: DEUIDXEUR }
          - { market: UK100, symbol: GBRIDXGBP }
          - { market: WTI, symbol: LIGHTCMDUSD }
          - { market: EURUSD, symbol: EURUSD }
          - { market: BTCUSD, symbol: BTCUSD }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Jetta dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             "git+https://github.com/tomas-charvat/Dukascopy_downloader.git@6dc1b07e697e86477721e8d99fcb824fb01d42ab"
          python - <<'PY'
          import dukascopy_downloader as d
          assert d.__version__ == "1.1.0", d.__version__
          print("dukascopy_downloader", d.__version__)
          PY

      - name: Acquire 2025 lockbox raw vendor responses
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/${{ matrix.market }}/2025"
          python v784_2025_jetta_m1.py             --market "${{ matrix.market }}"             --symbol "${{ matrix.symbol }}"             --year 2025             --rate 1.5             --out "$OUT"
          {
            python --version
            python -m pip freeze
          } > "$OUT/ENVIRONMENT.txt"
          sha256sum v784_2025_jetta_m1.py > "$OUT/ACQUISITION_CODE_SHA256.txt"

      - name: Verify hashes
        shell: bash
        run: |
          set -euo pipefail
          cd "out/${{ matrix.market }}/2025"
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V784-LOCKBOX-2025-${{ matrix.market }}
          path: out/${{ matrix.market }}/2025
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
