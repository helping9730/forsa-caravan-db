name: V791 Untouched 2011-2014 Transfer Raw M1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  acquire:
    name: ${{ matrix.market }}-${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { market: US500, symbol: USA500IDXUSD, year: 2011 }
          - { market: US500, symbol: USA500IDXUSD, year: 2012 }
          - { market: US500, symbol: USA500IDXUSD, year: 2013 }
          - { market: US500, symbol: USA500IDXUSD, year: 2014 }
          - { market: USTECH100, symbol: USATECHIDXUSD, year: 2011 }
          - { market: USTECH100, symbol: USATECHIDXUSD, year: 2012 }
          - { market: USTECH100, symbol: USATECHIDXUSD, year: 2013 }
          - { market: USTECH100, symbol: USATECHIDXUSD, year: 2014 }
          - { market: GERMANY40, symbol: DEUIDXEUR, year: 2011 }
          - { market: GERMANY40, symbol: DEUIDXEUR, year: 2012 }
          - { market: GERMANY40, symbol: DEUIDXEUR, year: 2013 }
          - { market: GERMANY40, symbol: DEUIDXEUR, year: 2014 }
          - { market: UK100, symbol: GBRIDXGBP, year: 2011 }
          - { market: UK100, symbol: GBRIDXGBP, year: 2012 }
          - { market: UK100, symbol: GBRIDXGBP, year: 2013 }
          - { market: UK100, symbol: GBRIDXGBP, year: 2014 }
          - { market: WTI, symbol: LIGHTCMDUSD, year: 2011 }
          - { market: WTI, symbol: LIGHTCMDUSD, year: 2012 }
          - { market: WTI, symbol: LIGHTCMDUSD, year: 2013 }
          - { market: WTI, symbol: LIGHTCMDUSD, year: 2014 }
          - { market: EURUSD, symbol: EURUSD, year: 2011 }
          - { market: EURUSD, symbol: EURUSD, year: 2012 }
          - { market: EURUSD, symbol: EURUSD, year: 2013 }
          - { market: EURUSD, symbol: EURUSD, year: 2014 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Jetta dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/tomas-charvat/Dukascopy_downloader.git@6dc1b07e697e86477721e8d99fcb824fb01d42ab"
          python - <<'PY'
          import dukascopy_downloader as d
          assert d.__version__ == "1.1.0", d.__version__
          PY
      - name: Acquire raw vendor responses
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/${{ matrix.market }}/${{ matrix.year }}"
          python v791_transfer_jetta_m1.py \
            --market "${{ matrix.market }}" \
            --symbol "${{ matrix.symbol }}" \
            --year "${{ matrix.year }}" \
            --rate 1.5 \
            --out "$OUT"
          {
            python --version
            python -m pip freeze
          } > "$OUT/ENVIRONMENT.txt"
          sha256sum v791_transfer_jetta_m1.py > "$OUT/ACQUISITION_CODE_SHA256.txt"
      - name: Verify hashes
        shell: bash
        run: |
          set -euo pipefail
          cd "out/${{ matrix.market }}/${{ matrix.year }}"
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V791T-${{ matrix.market }}-${{ matrix.year }}
          path: out/${{ matrix.market }}/${{ matrix.year }}
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
