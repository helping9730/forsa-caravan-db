name: V781 Transport Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Jetta transport
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/tomas-charvat/Dukascopy_downloader.git@6dc1b07e697e86477721e8d99fcb824fb01d42ab"
          python - <<'PY'
          import dukascopy_downloader as d
          print("dukascopy_downloader_version", d.__version__)
          assert d.__version__ == "1.1.0"
          PY

      - name: Jetta one-day USA500 M1 BID smoke
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/v781-smoke
          duka download USA500IDXUSD \
            --tf m1 \
            --from 2019-01-03 \
            --to 2019-01-03 \
            --side BID \
            --data-dir /tmp/v781-smoke \
            --rate 2 \
            --force
          duka status --data-dir /tmp/v781-smoke
          duka export USA500IDXUSD \
            --tf m1 \
            --from 2019-01-03 \
            --to 2019-01-03 \
            --side BID \
            --data-dir /tmp/v781-smoke \
            -o /tmp/USA500_2019-01-03_M1_BID.csv
          test -s /tmp/USA500_2019-01-03_M1_BID.csv
          sha256sum /tmp/USA500_2019-01-03_M1_BID.csv
          python - <<'PY'
          import csv
          p="/tmp/USA500_2019-01-03_M1_BID.csv"
          with open(p,newline="",encoding="utf-8-sig") as f:
              rows=list(csv.DictReader(f))
          print("rows",len(rows),"first",rows[0] if rows else None,"last",rows[-1] if rows else None)
          assert len(rows) > 100
          PY
