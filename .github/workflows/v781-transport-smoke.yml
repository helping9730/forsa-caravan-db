name: V781 Transport Smoke

on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Direct BI5 one-day smoke
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://datafeed.dukascopy.com/datafeed/USA500IDXUSD/2019/00/03/BID_candles_min_1.bi5"
          curl -fL --connect-timeout 10 --max-time 30 -A "V781-smoke/1.0" "$URL" -o /tmp/day.bi5
          ls -l /tmp/day.bi5
          sha256sum /tmp/day.bi5
          python - <<'PY'
          import lzma,struct
          p=open('/tmp/day.bi5','rb').read()
          d=lzma.decompress(p)
          print("compressed",len(p),"decoded",len(d),"records",len(d)//24,"rem",len(d)%24)
          print(struct.Struct(">IIIIIf").unpack_from(d,0))
          PY
      - name: Old direct-feed dukascopy-node smoke
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          mkdir -p /tmp/oldcli
          npx -y dukascopy-node@1.46.4 -i usa500idxusd -from 2019-01-03 -to 2019-01-04 -t m1 -f csv -p bid -dir /tmp/oldcli -fn one_day -v
          find /tmp/oldcli -type f -maxdepth 2 -ls
